<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="彩票历史数据采集、统计分析与结构化选号工具。历史数据不提高中奖概率，不构成购彩建议。" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>彩票数据观察</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('lottery-theme')
          if (t === 'light' || t === 'dark') {
            document.documentElement.dataset.theme = t
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
